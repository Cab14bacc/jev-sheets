<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <!-- Google's recommended stylesheet for Editor add-ons -->
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css" />
    <style>
      body { padding: 12px; }
      h2 { font-size: 14px; margin: 18px 0 6px; }
      h2:first-child { margin-top: 0; }
      p { margin: 4px 0 8px; line-height: 1.4; }
      input[type="password"] { width: 100%; box-sizing: border-box; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .status { padding: 8px; border-radius: 4px; background: #f1f3f4; margin: 6px 0; }
      .status.ok { background: #e6f4ea; }
      .status.missing { background: #fce8e6; }
      .muted { color: #5f6368; font-size: 12px; }
      label { display: block; margin: 6px 0; }
      #message { margin-top: 10px; white-space: pre-wrap; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <h2>API key</h2>
    <div id="status" class="status">Loading…</div>

    <p>
      Jev needs your own TypeSafe API key. Get one at
      <a href="https://console.typesafe.ai/keys" target="_blank" rel="noopener">console.typesafe.ai/keys</a>.
    </p>
    <input id="key" type="password" placeholder="Paste API key" autocomplete="off" />
    <label><input type="radio" name="where" value="user" checked /> Just for me</label>
    <label>
      <input type="radio" name="where" value="document" /> Everyone using Jev in this spreadsheet
      <span class="muted">(their formulas are billed to your key)</span>
    </label>
    <div class="row">
      <button class="action" id="save">Save key</button>
      <button id="test">Test connection</button>
    </div>
    <div class="row" id="removeRow"></div>
    <div id="message" class="muted"></div>

    <h2>Try it</h2>
    <p><code>=JEV_IF(A2, "Is this a complaint?")</code></p>
    <p><code>=JEV_CHOICE(A2:A100, "billing, technical, sales")</code></p>
    <div class="row"><button id="examples">Insert example sheet</button></div>
    <p class="muted">
      Cell text is sent only to TypeSafe (api.typesafe.ai) to get answers.
      <a href="https://cab14bacc.github.io/jev-sheets/privacy.html" target="_blank" rel="noopener">Privacy</a>
    </p>

    <script>
      const $ = (id) => document.getElementById(id);
      const busy = (on) => document.querySelectorAll("button").forEach((b) => (b.disabled = on));
      const say = (text, isError) => {
        $("message").textContent = text || "";
        $("message").className = isError ? "error" : "muted";
      };
      const call = (fn, ...args) =>
        new Promise((resolve, reject) => {
          busy(true);
          google.script.run
            .withSuccessHandler((r) => { busy(false); resolve(r); })
            .withFailureHandler((e) => { busy(false); reject(e); })[fn](...args);
        });

      function render(s) {
        const el = $("status");
        if (s.active === "user") {
          el.className = "status ok";
          el.textContent = "Using your key " + s.user + ".";
        } else if (s.active === "document") {
          el.className = "status ok";
          el.textContent = "Using this spreadsheet's shared key " + s.document + ".";
        } else {
          el.className = "status missing";
          el.textContent = "No API key yet. Formulas will show an error until you add one.";
        }
        const row = $("removeRow");
        row.innerHTML = "";
        [["user", s.user, "Remove my key"], ["document", s.document, "Remove shared key"]].forEach(([where, has, label]) => {
          if (!has) return;
          const b = document.createElement("button");
          b.textContent = label;
          b.onclick = () => call("jevSidebarRemoveKey", where).then((st) => { render(st); say("Key removed."); }, (e) => say(e.message, true));
          row.appendChild(b);
        });
      }

      $("save").onclick = () => {
        const where = document.querySelector('input[name="where"]:checked').value;
        call("jevSidebarSaveKey", $("key").value, where)
          .then((s) => { $("key").value = ""; render(s); say("Key saved. Testing…"); return call("jevSidebarTest"); })
          .then((r) => say(r.message, !r.ok), (e) => say(e.message, true));
      };
      $("test").onclick = () => { say("Testing…"); call("jevSidebarTest").then((r) => say(r.message, !r.ok), (e) => say(e.message, true)); };
      $("examples").onclick = () => call("jevInsertExamples").then(() => say("Example sheet inserted."), (e) => say(e.message, true));

      call("jevSidebarStatus").then(render, (e) => say(e.message, true));
    </script>
  </body>
</html>
